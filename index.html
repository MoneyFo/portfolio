<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wild Tamatoa — Portfolio</title>
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/script.js"></script>
</head>
<body>

  <main>
    <!-- Machine à écrire -->
    <ascii-art class="tw" src="/pieces/typewriter.js" options='{"prefix":"","phrases":["language i try to speak."]}' aria-label="language i try to speak."></ascii-art>

    <!-- Langages : le nom apparaît au survol -->
    <div class="langs">
      <div class="float" tabindex="0">
        <ascii-art piece="c" options='{"shine":5}' aria-label="Logo C en ASCII animé"></ascii-art>
        <span class="name" aria-hidden="true">C</span>
      </div>
      <div class="float" tabindex="0">
        <ascii-art piece="java" options='{"shine":5}' aria-label="Logo Java en ASCII animé"></ascii-art>
        <span class="name" aria-hidden="true">Java</span>
      </div>
      <div class="float" tabindex="0">
        <ascii-art piece="javascript" options='{"shine":5}' aria-label="Logo JavaScript en ASCII animé"></ascii-art>
        <span class="name" aria-hidden="true">JavaScript</span>
      </div>
      <div class="float" tabindex="0">
        <ascii-art piece="php" options='{"shine":5}' aria-label="Logo PHP en ASCII animé"></ascii-art>
        <span class="name" aria-hidden="true">PHP</span>
      </div>
      <div class="float" tabindex="0">
        <ascii-art piece="python" options='{"shine":5}' aria-label="Logo Python en ASCII animé"></ascii-art>
        <span class="name" aria-hidden="true">Python</span>
      </div>
    </div>
  </main>

  <footer>
    <!-- <ascii-art piece="cloudflare" aria-label="Cloudflare"></ascii-art> --> 
    © 2026 Wild Tamatoa · designed &amp; built with <a href="https://claude.ai">Claude</a> ·  Powered by <a href="https://cloudflare.com">Cloudflare</a>
  </footer>

</body>
</html>
