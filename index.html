<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild Tamatoa — Portfolio</title>
<meta name="theme-color" content="#09090b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Plex Mono";font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-mono-400.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:700;font-display:swap;src:url(/fonts/ibm-plex-mono-700.woff2) format("woff2")}
:root{color-scheme:dark;--bg:#09090b;--fg:#f2f2f3;--f:"Plex Mono","BlexMono Nerd Font","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;font:400 15px/1.7 var(--f);color:var(--fg);background:var(--bg)}
/* Fond pointillé */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(rgba(255,255,255,.05) 1.2px,transparent 1.2px) 0 0/28px 28px,var(--bg)}
/* Pièces ASCII animées (ascii.rest) : machine à écrire, puis les langages qui flottent en décalé */
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(20px,4vw,48px);padding:24px;max-width:1240px;margin:0 auto}
.tw{display:block;font:400 clamp(12px,2.2vw,20px)/1.2 var(--f);color:var(--fg)}
.tw pre{font:inherit;margin:0}
.langs{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(16px,3vw,40px)}
.float{animation:float 6s ease-in-out infinite}
.float:nth-child(2){animation-delay:-1.2s}.float:nth-child(3){animation-delay:-2.4s}.float:nth-child(4){animation-delay:-3.6s}.float:nth-child(5){animation-delay:-4.8s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.langs ascii-art{display:block;width:clamp(120px,16vw,200px)}
@media(prefers-reduced-motion:reduce){.float{animation:none}}
</style>
<script type="module" src="https://ascii.rest/ascii.js"></script>
</head><body>
<main><ascii-art class="tw" src="/pieces/typewriter.js" options='{"prefix":"","phrases":["language i try to speak."]}' aria-label="language i try to speak."></ascii-art><div class="langs"><div class="float"><ascii-art piece="c" options='{"shine":5}' aria-label="Logo C en ASCII animé"></ascii-art></div><div class="float"><ascii-art piece="java" options='{"shine":5}' aria-label="Logo Java en ASCII animé"></ascii-art></div><div class="float"><ascii-art piece="javascript" options='{"shine":5}' aria-label="Logo JavaScript en ASCII animé"></ascii-art></div><div class="float"><ascii-art piece="php" options='{"shine":5}' aria-label="Logo PHP en ASCII animé"></ascii-art></div><div class="float"><ascii-art piece="python" options='{"shine":5}' aria-label="Logo Python en ASCII animé"></ascii-art></div></div></main>
</body></html>
