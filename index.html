<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild Tamatoa — Portfolio</title>
<meta name="theme-color" content="#09090b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Plex Mono";font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-mono-400.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:700;font-display:swap;src:url(/fonts/ibm-plex-mono-700.woff2) format("woff2")}
:root{color-scheme:dark;--bg:#09090b;--fg:#f2f2f3;--f:"Plex Mono","BlexMono Nerd Font","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;font:400 15px/1.7 var(--f);color:var(--fg);background:var(--bg)}
/* Fond pointillé */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(rgba(255,255,255,.05) 1.2px,transparent 1.2px) 0 0/28px 28px,var(--bg)}
/* Pièce ASCII animée (ascii.rest) au centre, qui flotte doucement */
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
ascii-art{display:block;width:min(420px,72vw)}
@media(prefers-reduced-motion:reduce){.float{animation:none}}
</style>
<script type="module" src="https://ascii.rest/ascii.js"></script>
</head><body>
<main><div class="float"><ascii-art piece="c" options='{"shine":5}' aria-label="Logo du langage C en ASCII animé"></ascii-art></div></main>
</body></html>
